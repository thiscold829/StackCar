<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StackCar Command Center</title>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    'orbitron': ['Orbitron', 'sans-serif'],
                    'mono': ['"Share Tech Mono"', 'monospace'],
                }
            }
        }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="config.js"></script>
    <style>
        body { font-family:'Noto Sans KR',sans-serif; background-color:#f8fafc;
            background-image:linear-gradient(rgba(148,163,184,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.1) 1px,transparent 1px);
            background-size:20px 20px; color:#1e293b; overscroll-behavior-y:none; }
        .crosshair-box { position:relative; background:rgba(255,255,255,.7); backdrop-filter:blur(8px);
            border:1px solid rgba(226,232,240,.8); border-radius:4px; box-shadow:0 4px 20px -2px rgba(0,0,0,.02); }
        .crosshair-box::before,.crosshair-box::after { content:''; position:absolute; width:10px; height:10px; pointer-events:none; }
        .crosshair-box::before { top:-1px;left:-1px; border-top:1.5px solid #0ea5e9; border-left:1.5px solid #0ea5e9; }
        .crosshair-box::after  { bottom:-1px;right:-1px; border-bottom:1.5px solid #0ea5e9; border-right:1.5px solid #0ea5e9; }
        .no-scrollbar::-webkit-scrollbar { display:none; }
        .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
        .fa-spin { animation:spin 1s linear infinite; }
        .odo-autofill { background-color:#f0f9ff !important; border-color:#bae6fd !important; }
        details summary::-webkit-details-marker { display:none; }
        details[open] .details-chevron { transform:rotate(180deg); }
        .details-chevron { transition:transform .2s; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

<div class="max-w-3xl w-full p-4 sm:p-6 pb-24 relative z-10 flex flex-col gap-4">

    <header class="flex justify-between items-center mb-2">
        <div>
            <h1 class="font-orbitron text-xl sm:text-2xl font-bold tracking-widest text-slate-800">STACK<span class="text-sky-500">CAR</span></h1>
            <p class="font-mono text-[10px] text-slate-500">ID: This_Cold // SYS.ONLINE</p>
        </div>
        <button onclick="location.href='settings.html'" class="w-10 h-10 rounded-full border border-slate-200 bg-white flex items-center justify-center text-slate-400 hover:text-sky-500 cursor-pointer transition-colors shadow-sm outline-none">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <!-- Time + Weather -->
    <div class="grid grid-cols-2 gap-3">
        <div class="crosshair-box p-3 flex flex-col justify-center">
            <span class="font-orbitron text-[10px] text-slate-400 tracking-widest mb-1">SYS.TIME</span>
            <span id="live-clock" class="font-mono text-sm sm:text-base text-slate-800 font-bold">--:--:--</span>
            <span id="live-date"  class="font-mono text-[10px] text-slate-500 mt-0.5">YYYY.MM.DD</span>
        </div>
        <div class="crosshair-box p-3 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="font-orbitron text-[10px] text-slate-400 tracking-widest mb-1">ENV.DATA</span>
                <span id="weather-temp" class="font-mono text-sm sm:text-base text-slate-800 font-bold">Seoul, --°C</span>
                <div class="flex items-center gap-1 mt-0.5">
                    <span id="gas-price-display" class="font-mono text-[10px] text-sky-500">Avg Gas: ₩--</span>
                    <button onclick="toggleGasEdit()" class="text-slate-300 hover:text-sky-400 transition-colors ml-0.5 leading-none">
                        <i class="fa-solid fa-pencil text-[8px]"></i>
                    </button>
                </div>
                <div id="gas-edit-area" class="hidden">
                    <div class="flex items-center gap-1 mt-1">
                        <span class="font-mono text-[9px] text-slate-400">₩</span>
                        <input type="number" id="input-gas-price"
                            class="w-20 bg-white border border-sky-300 rounded-sm px-1.5 py-0.5 font-mono text-[10px] text-slate-800 focus:outline-none focus:ring-1 focus:ring-sky-400"
                            placeholder="1640" onkeydown="if(event.key==='Enter')saveGasPrice()">
                        <button onclick="saveGasPrice()" class="font-orbitron text-[8px] text-white bg-sky-500 px-1.5 py-0.5 rounded-sm">OK</button>
                    </div>
                </div>
            </div>
            <i id="weather-icon" class="fa-solid fa-cloud-sun text-2xl text-slate-300"></i>
        </div>
    </div>

    <!-- Trajectory + Efficiency -->
    <div class="crosshair-box p-5">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <span class="font-orbitron text-[10px] text-sky-500 tracking-widest block mb-1">TRAJECTORY</span>
                <div class="flex items-end gap-1">
                    <span id="display-odo" class="font-mono text-2xl sm:text-3xl font-bold text-slate-800">--</span>
                    <span class="font-orbitron text-xs text-slate-400 mb-1">KM</span>
                </div>
            </div>
            <div class="pl-4 border-l border-slate-200">
                <span class="font-orbitron text-[10px] text-slate-400 tracking-widest block mb-1">EFFICIENCY</span>
                <div class="flex items-end gap-1">
                    <span id="display-efficiency" class="font-mono text-2xl sm:text-3xl font-bold text-slate-800">--</span>
                    <span class="font-orbitron text-xs text-slate-400 mb-1">KM/L</span>
                </div>
                <span id="display-efficiency-last" class="font-mono text-[10px] text-slate-400 mt-0.5 block"></span>
            </div>
        </div>
    </div>

    <!-- Cost Cards -->
    <div class="grid grid-cols-2 gap-3">
        <button id="btn-cost-refuel" class="bg-white border border-slate-200 p-4 rounded-sm shadow-sm flex flex-col items-start hover:border-sky-300 transition-colors group text-left">
            <div class="w-full flex justify-between items-center mb-2">
                <span id="label-refuel-month" class="font-orbitron text-[10px] text-slate-400 tracking-widest">... REFUEL</span>
                <i class="fa-solid fa-caret-down text-slate-300 group-hover:text-sky-500"></i>
            </div>
            <span id="display-refuel-cost" class="font-mono text-lg font-bold text-slate-800">₩ --</span>
        </button>
        <button id="btn-cost-service" class="bg-white border border-slate-200 p-4 rounded-sm shadow-sm flex flex-col items-start hover:border-slate-400 transition-colors group text-left">
            <div class="w-full flex justify-between items-center mb-2">
                <span id="label-service-month" class="font-orbitron text-[10px] text-slate-400 tracking-widest">... SERVICE</span>
                <i class="fa-solid fa-caret-down text-slate-300 group-hover:text-slate-600"></i>
            </div>
            <span id="display-service-cost" class="font-mono text-lg font-bold text-slate-800">₩ --</span>
        </button>
    </div>

    <!-- Recent Activity (구 SYSTEM DIAGNOSTICS) -->
    <div id="diagnostics-card" class="crosshair-box p-4">
        <div class="flex justify-between items-center mb-2 border-b border-slate-100 pb-1.5">
            <h2 class="font-orbitron text-sm font-bold text-slate-800">RECENT ACTIVITY</h2>
            <button id="btn-open-manage-diag" class="font-mono text-[10px] text-sky-500 hover:text-sky-700 transition-colors">MANAGE_ALL <i class="fa-solid fa-arrow-right ml-1"></i></button>
        </div>
        <div id="diagnostics-list" class="flex flex-col">
            <div class="text-center text-slate-400 font-mono text-sm py-4">LOADING...</div>
        </div>
    </div>
</div>

<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-100 via-slate-50/90 to-transparent z-30 flex justify-center gap-3 max-w-3xl mx-auto w-full">
    <button id="btn-open-refuel" class="flex-1 bg-sky-500 hover:bg-sky-600 text-white font-orbitron font-bold tracking-widest py-4 rounded-sm shadow-lg shadow-sky-200 transition-all active:scale-95 flex justify-center items-center gap-2">
        <i class="fa-solid fa-gas-pump"></i> REFUEL
    </button>
    <button id="btn-open-service" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-orbitron font-bold tracking-widest py-4 rounded-sm shadow-lg shadow-slate-300 transition-all active:scale-95 flex justify-center items-center gap-2">
        <i class="fa-solid fa-wrench"></i> SERVICE
    </button>
</div>

<!-- z-40: Main Backdrop -->
<div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

<!-- z-50: REFUEL MODAL -->
<div id="refuel-modal" class="fixed bottom-0 left-0 right-0 z-50 transform translate-y-full transition-transform duration-300 ease-in-out flex justify-center pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md w-full max-w-3xl rounded-t-xl border-t border-x border-slate-200 shadow-[0_-10px_40px_-15px_rgba(14,165,233,.3)] p-6 pointer-events-auto max-h-[90vh] overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-orbitron text-xl font-bold text-slate-800"><i class="fa-solid fa-gas-pump text-sky-500 mr-2"></i>ENERGY_RECHARGE</h3>
            <button id="btn-close-refuel" class="text-slate-400 hover:text-slate-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form class="space-y-5" onsubmit="event.preventDefault();">
            <!-- Date: collapsible -->
            <details id="refuel-date-details" class="border border-slate-100 rounded-sm bg-slate-50/50">
                <summary class="p-3 cursor-pointer list-none flex justify-between items-center select-none">
                    <span class="font-orbitron text-[10px] text-slate-400 tracking-widest">DATE &nbsp;<span id="refuel-date-preview" class="text-slate-600 font-mono normal-case text-[10px]">--</span></span>
                    <i class="fa-solid fa-chevron-down details-chevron text-slate-300 text-[9px]"></i>
                </summary>
                <div class="px-3 pb-3">
                    <input type="date" id="input-refuel-date"
                        class="w-full bg-white border border-slate-200 rounded-sm p-2.5 font-mono text-sm text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all"
                        onchange="document.getElementById('refuel-date-preview').textContent=this.value">
                </div>
            </details>
            <div>
                <label class="block font-orbitron text-[10px] text-slate-500 tracking-widest mb-1">STATION NAME (OPTIONAL)</label>
                <input type="text" id="input-station" placeholder="주유소명 (미입력 시 '주유소')" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-sm text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all placeholder-slate-300">
            </div>
            <div>
                <label class="block font-orbitron text-[10px] text-sky-600 tracking-widest mb-1">ODOMETER (KM)</label>
                <input type="number" id="input-refuel-odo" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-lg text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-orbitron text-[10px] text-slate-500 tracking-widest mb-1">PRICE (KRW/L)</label>
                    <input type="number" id="input-price" placeholder="1650" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-base text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block font-orbitron text-[10px] text-slate-500 tracking-widest mb-1">TOTAL COST (KRW)</label>
                    <input type="number" id="input-cost" placeholder="50000" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-base text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all">
                </div>
            </div>
            <div class="bg-sky-50 border border-sky-100 p-3 rounded-sm flex justify-between items-center">
                <span class="font-orbitron text-[10px] text-sky-600 tracking-widest">CALCULATED VOLUME</span>
                <div class="flex items-end gap-1">
                    <span id="display-volume" class="font-mono text-xl font-bold text-sky-700">0.00</span>
                    <span class="font-orbitron text-[10px] text-sky-600 mb-1">LITERS</span>
                </div>
            </div>
            <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-sm cursor-pointer hover:bg-slate-50 transition-colors">
                <div class="relative">
                    <input type="checkbox" id="input-fulltank" class="sr-only peer" checked>
                    <div class="w-10 h-6 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-sky-500"></div>
                </div>
                <span class="font-orbitron text-xs text-slate-700 font-bold tracking-wide">FULL TANK OVERRIDE</span>
            </label>
            <button id="btn-submit-refuel" class="w-full mt-4 bg-sky-500 hover:bg-sky-600 text-white font-orbitron font-bold tracking-widest py-4 rounded-sm shadow-lg shadow-sky-200 transition-all active:scale-[.98] flex justify-center items-center gap-2">
                <i class="fa-solid fa-satellite-dish"></i> SYNC_TO_DB
            </button>
        </form>
    </div>
</div>

<!-- z-50: SERVICE MODAL -->
<div id="service-modal" class="fixed bottom-0 left-0 right-0 z-50 transform translate-y-full transition-transform duration-300 ease-in-out flex justify-center pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md w-full max-w-3xl rounded-t-xl border-t border-x border-slate-200 shadow-[0_-10px_40px_-15px_rgba(15,23,42,.3)] p-6 pointer-events-auto max-h-[90vh] overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-orbitron text-xl font-bold text-slate-800"><i class="fa-solid fa-wrench text-slate-600 mr-2"></i>SYSTEM_MAINTENANCE</h3>
            <button id="btn-close-service" class="text-slate-400 hover:text-slate-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-orbitron text-[10px] text-sky-600 tracking-widest mb-1">ODOMETER (KM)</label>
                    <input type="number" id="input-service-odo" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-lg text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block font-orbitron text-[10px] text-slate-500 tracking-widest mb-1">DATE</label>
                    <input type="date" id="input-service-date" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-sm text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all">
                </div>
            </div>
            <div>
                <label class="block font-orbitron text-[10px] text-sky-600 tracking-widest mb-1">SYSTEM MAINTENANCE ITEM</label>
                <button type="button" id="btn-open-item-selector" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-lg text-slate-800 text-left flex justify-between items-center hover:bg-slate-100 outline-none transition-all">
                    <div class="flex flex-col">
                        <span id="selected-item-display" class="text-slate-400 text-sm">선택 대기 중...</span>
                        <span id="selected-item-code" class="font-orbitron text-[10px] text-sky-600 hidden mt-0.5"></span>
                    </div>
                    <i class="fa-solid fa-list-ul text-slate-400"></i>
                </button>
                <input type="hidden" id="input-service-item-code">
                <input type="hidden" id="input-service-item-name">
            </div>
            <div>
                <label class="block font-orbitron text-[10px] text-slate-500 tracking-widest mb-1">TOTAL COST (KRW)</label>
                <input type="number" id="input-service-cost" placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-base text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all">
            </div>
            <div>
                <label class="block font-orbitron text-[10px] text-slate-500 tracking-widest mb-1">ENGINEER'S LOG (MEMO)</label>
                <textarea id="input-service-memo" rows="2" placeholder="특이사항 입력..." class="w-full bg-slate-50 border border-slate-200 rounded-sm p-3 font-mono text-sm text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all resize-none"></textarea>
            </div>
            <button id="btn-submit-service" class="w-full mt-6 bg-slate-800 hover:bg-slate-900 text-white font-orbitron font-bold tracking-widest py-4 rounded-sm shadow-lg shadow-slate-200 transition-all active:scale-[.98] flex justify-center items-center gap-2">
                <i class="fa-solid fa-satellite-dish"></i> SYNC_TO_DB
            </button>
        </div>
    </div>
</div>

<!-- z-60/70: ITEM SELECTOR -->
<div id="item-selector-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div id="item-selector-modal" class="fixed bottom-0 left-0 right-0 z-[70] transform translate-y-full transition-transform duration-300 ease-in-out flex justify-center pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md w-full max-w-3xl rounded-t-xl border-t border-x border-slate-200 shadow-[0_-10px_40px_-15px_rgba(2,132,199,.3)] pointer-events-auto h-[85vh] flex flex-col">
        <div class="flex justify-between items-center p-5 border-b border-slate-200 shrink-0">
            <h3 class="font-orbitron text-lg font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-database text-sky-600"></i> ITEM_ARCHIVE</h3>
            <button id="btn-close-item-selector" class="text-slate-400 hover:text-red-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div class="p-4 border-b border-slate-100 bg-slate-50/80 shrink-0">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="input-item-search" placeholder="항목명, 태그 또는 코드 검색..." class="w-full bg-white border border-slate-200 rounded-sm py-3 pl-10 pr-4 font-mono text-sm text-slate-800 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 outline-none transition-all placeholder-slate-300">
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 no-scrollbar" id="item-list-container"></div>
    </div>
</div>

<!-- z-75/80: COST DETAIL -->
<div id="cost-detail-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[75] opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div id="cost-detail-modal" class="fixed bottom-0 left-0 right-0 z-[80] transform translate-y-full transition-transform duration-300 ease-in-out flex justify-center pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md w-full max-w-3xl rounded-t-xl border-t border-x border-slate-200 shadow-[0_-10px_40px_-15px_rgba(14,165,233,.2)] p-5 pointer-events-auto max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center mb-4 shrink-0">
            <h3 id="cost-detail-title" class="font-orbitron text-base font-bold text-slate-800"></h3>
            <button id="btn-close-cost-detail" class="text-slate-400 hover:text-slate-700 text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <!-- Preset Buttons -->
        <div class="flex gap-2 mb-3 shrink-0">
            <button id="preset-month" onclick="setCostPreset('month')" class="font-orbitron text-[9px] tracking-widest px-2.5 py-1.5 rounded-sm bg-sky-500 text-white transition-colors">이번달</button>
            <button id="preset-year"  onclick="setCostPreset('year')"  class="font-orbitron text-[9px] tracking-widest px-2.5 py-1.5 rounded-sm border border-slate-200 text-slate-500 hover:border-sky-400 hover:text-sky-600 transition-colors">올해</button>
            <button id="preset-all"   onclick="setCostPreset('all')"   class="font-orbitron text-[9px] tracking-widest px-2.5 py-1.5 rounded-sm border border-slate-200 text-slate-500 hover:border-sky-400 hover:text-sky-600 transition-colors">전체</button>
        </div>
        <!-- Date Range -->
        <div class="grid grid-cols-2 gap-3 mb-4 shrink-0">
            <div>
                <label class="font-orbitron text-[10px] text-slate-400 tracking-widest block mb-1">FROM</label>
                <input type="date" id="cost-filter-from" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-2 font-mono text-sm outline-none focus:border-sky-500">
            </div>
            <div>
                <label class="font-orbitron text-[10px] text-slate-400 tracking-widest block mb-1">TO</label>
                <input type="date" id="cost-filter-to" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-2 font-mono text-sm outline-none focus:border-sky-500">
            </div>
        </div>
        <div class="bg-sky-50 border border-sky-100 rounded-sm p-3 mb-4 flex justify-between items-center shrink-0">
            <span class="font-orbitron text-[10px] text-sky-600 tracking-widest">PERIOD TOTAL</span>
            <span id="cost-detail-total" class="font-mono text-xl font-bold text-sky-700">₩ 0</span>
        </div>
        <div id="cost-detail-list" class="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-2"></div>
    </div>
</div>

<!-- z-85/90: MANAGE_ALL -->
<div id="manage-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[85] opacity-0 pointer-events-none transition-opacity duration-300"></div>
<div id="manage-modal" class="fixed bottom-0 left-0 right-0 z-[90] transform translate-y-full transition-transform duration-300 ease-in-out flex justify-center pointer-events-none">
    <div class="bg-white w-full max-w-3xl h-[95dvh] rounded-t-xl border-t border-x border-slate-200 shadow-[0_-10px_50px_-10px_rgba(0,0,0,.2)] pointer-events-auto flex flex-col">
        <div class="flex justify-between items-center px-5 py-4 border-b border-slate-200 shrink-0">
            <div class="flex items-center gap-3">
                <h3 class="font-orbitron text-sm font-bold text-slate-800"><i class="fa-solid fa-database text-sky-500 mr-2"></i>MANAGE_ALL</h3>
                <span id="manage-sync-status" class="font-mono text-[10px] text-amber-500 transition-all"></span>
            </div>
            <button id="btn-close-manage" class="text-slate-400 hover:text-slate-700 w-8 h-8 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <!-- Filter Buttons (replaces tabs) -->
        <div class="flex gap-2 px-4 py-3 border-b border-slate-200 shrink-0 bg-slate-50">
            <button id="mf-all"     onclick="switchManageFilter('all')"     class="font-orbitron text-[10px] tracking-widest px-3 py-1.5 rounded-sm bg-sky-500 text-white transition-colors">전체</button>
            <button id="mf-service" onclick="switchManageFilter('service')" class="font-orbitron text-[10px] tracking-widest px-3 py-1.5 rounded-sm border border-slate-200 text-slate-500 hover:border-sky-400 hover:text-sky-600 transition-colors bg-white">SERVICE</button>
            <button id="mf-refuel"  onclick="switchManageFilter('refuel')"  class="font-orbitron text-[10px] tracking-widest px-3 py-1.5 rounded-sm border border-slate-200 text-slate-500 hover:border-sky-400 hover:text-sky-600 transition-colors bg-white">REFUEL</button>
        </div>
        <div id="manage-content" class="flex-1 overflow-y-auto no-scrollbar p-4"></div>
    </div>
</div>

<form id="hidden_form" target="hidden_iframe" method="POST" style="display:none;">
    <input type="hidden" name="payload" id="payload_input">
</form>
<iframe name="hidden_iframe" style="display:none;" onload="if(window.isSaving) onSaveSuccess();"></iframe>

<script>
/* ==================== CONFIG ==================== */
const S_ID  = (typeof CONFIG!=='undefined'&&CONFIG.SHEET_ID) ? CONFIG.SHEET_ID : '';
const A_URL = (typeof CONFIG!=='undefined'&&CONFIG.API_URL)  ? CONFIG.API_URL  : '';

/* ==================== DATA ==================== */
let maintenanceItems = [];
let refuelLogs       = [];
let serviceLogs      = [];
let gasPrice = parseInt(localStorage.getItem('stackcar_gas_price')) || 0;

/* ==================== INIT ==================== */
window.onload = async () => {
    updateClock();
    setInterval(updateClock, 1000);
    setMonthLabels();
    initGasPriceDisplay();
    await loadAllDataFromDB();
    updateDashboard();
    loadWeather();
    setTimeout(renderDiagnostics, 200);
};

let _resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(renderDiagnostics, 200);
});

/* ==================== WEATHER (Open-Meteo) ==================== */
async function loadWeather() {
    try {
        const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
        const d = await r.json();
        const temp = Math.round(d.current.temperature_2m);
        document.getElementById('weather-temp').textContent = `Seoul, ${temp}\u00b0C`;
        document.getElementById('weather-icon').className = `fa-solid ${wmoIcon(d.current.weather_code)} text-2xl text-slate-300`;
    } catch(e) {}
}
function wmoIcon(c) {
    if (c === 0)  return 'fa-sun';
    if (c <= 2)   return 'fa-cloud-sun';
    if (c <= 3)   return 'fa-cloud';
    if (c <= 49)  return 'fa-smog';
    if (c <= 67)  return 'fa-cloud-rain';
    if (c <= 77)  return 'fa-snowflake';
    if (c <= 82)  return 'fa-cloud-showers-heavy';
    return 'fa-cloud-bolt';
}

/* ==================== GAS PRICE ==================== */
function initGasPriceDisplay() {
    document.getElementById('gas-price-display').textContent =
        gasPrice > 0 ? `Avg Gas: \u20a9${gasPrice.toLocaleString()}` : 'Avg Gas: \u20a9--';
}
function toggleGasEdit() {
    const area = document.getElementById('gas-edit-area');
    area.classList.toggle('hidden');
    if (!area.classList.contains('hidden')) {
        const inp = document.getElementById('input-gas-price');
        if (gasPrice > 0) inp.value = gasPrice;
        inp.focus();
    }
}
function saveGasPrice() {
    const v = parseInt(document.getElementById('input-gas-price').value);
    if (v > 0) {
        gasPrice = v;
        localStorage.setItem('stackcar_gas_price', v);
        document.getElementById('gas-price-display').textContent = `Avg Gas: \u20a9${v.toLocaleString()}`;
    }
    document.getElementById('gas-edit-area').classList.add('hidden');
}

/* ==================== DB LOAD ==================== */
async function loadAllDataFromDB() {
    if (!S_ID) return;
    try {
        let res, parsed;
        res    = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=maintenance_items`);
        parsed = parseCSV(await res.text());
        if (parsed && parsed.length) {
            maintenanceItems = parsed.map(r => ({
                id:             r.id            || '',
                name:           r.name          || '',
                tag:            r.tag           || 'ETC',
                interval_km:    parseFloat(r.interval_km)    || 0,
                interval_month: parseFloat(r.interval_month) || 0,
                order:          parseFloat(r.order)          || 99
            }));
        }
        res    = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=refuel_tx`);
        parsed = parseCSV(await res.text());
        if (parsed && parsed.length) refuelLogs = parsed;

        res    = await fetch(`https://docs.google.com/spreadsheets/d/${S_ID}/gviz/tq?tqx=out:csv&sheet=maintenance_history`);
        parsed = parseCSV(await res.text());
        if (parsed && parsed.length) serviceLogs = parsed;
    } catch(e) { console.warn('DB load failed:', e); }
}

/* ==================== DASHBOARD ==================== */
function getCurrentOdo() {
    const all = [
        ...refuelLogs.map(r  => parseFloat(r.odo)  || 0),
        ...serviceLogs.map(s => parseFloat(s.odo) || 0)
    ];
    return all.length ? Math.max(...all) : 0;
}

function calcCumulativeEfficiency() {
    const valid = refuelLogs
        .filter(r => parseFloat(r.odo) > 0 && parseFloat(r.volume) > 0)
        .sort((a,b) => parseFloat(a.odo)-parseFloat(b.odo));
    if (valid.length < 2) return '--';
    const totalKm   = parseFloat(valid[valid.length-1].odo) - parseFloat(valid[0].odo);
    const totalFuel = valid.slice(1).reduce((s,r) => s+(parseFloat(r.volume)||0), 0);
    if (!totalFuel || totalKm <= 0) return '--';
    return (totalKm/totalFuel).toFixed(1);
}

function calcLastTripEfficiency() {
    const valid = refuelLogs
        .filter(r => parseFloat(r.odo) > 0 && parseFloat(r.volume) > 0 && r.is_full_tank === 'TRUE')
        .sort((a,b) => parseFloat(b.odo)-parseFloat(a.odo));
    if (valid.length < 2) return null;
    const km   = parseFloat(valid[0].odo) - parseFloat(valid[1].odo);
    const fuel = parseFloat(valid[0].volume);
    if (km <= 0 || fuel <= 0) return null;
    return (km/fuel).toFixed(1);
}

function getMonthCost(logs, y, m) {
    return logs
        .filter(r => { const d=new Date(r.date); return d.getFullYear()===y && (d.getMonth()+1)===m; })
        .reduce((s,r) => s+(parseFloat(r.cost)||0), 0);
}

function setMonthLabels() {
    const mon = new Date().toLocaleString('en-US',{month:'short'}).toUpperCase()+'.';
    document.getElementById('label-refuel-month').textContent  = mon+' REFUEL';
    document.getElementById('label-service-month').textContent = mon+' SERVICE';
}

function updateDashboard() {
    const odo = getCurrentOdo();
    document.getElementById('display-odo').textContent = odo > 0 ? odo.toLocaleString() : '--';

    document.getElementById('display-efficiency').textContent = calcCumulativeEfficiency();
    const lastEff = calcLastTripEfficiency();
    document.getElementById('display-efficiency-last').textContent = lastEff ? `LAST: ${lastEff} KM/L` : '';

    const now=new Date(), y=now.getFullYear(), m=now.getMonth()+1;
    document.getElementById('display-refuel-cost').textContent  = '\u20a9 '+getMonthCost(refuelLogs, y, m).toLocaleString();
    document.getElementById('display-service-cost').textContent = '\u20a9 '+getMonthCost(serviceLogs,y, m).toLocaleString();

    if (odo > 0) {
        setOdoWithIndicator('input-refuel-odo',  odo);
        setOdoWithIndicator('input-service-odo', odo);
    }
}

function setOdoWithIndicator(id, value) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = value;
    el.classList.add('odo-autofill');
    el.addEventListener('input', () => el.classList.remove('odo-autofill'), {once:true});
}

/* ==================== DIAGNOSTICS (B안) ==================== */
function calcMaxDiagItems() {
    const card = document.getElementById('diagnostics-card');
    if (!card) return 3;
    // Absolute page position (scroll-independent)
    let top = 0, el = card;
    while (el) { top += el.offsetTop; el = el.offsetParent; }
    const vh = window.innerHeight;
    const bottomBarH = 88;
    const cardOverhead = 52; // p-4 top(16) + header row(28) + pb(8)
    const available = vh - top - cardOverhead - bottomBarH;
    return Math.max(0, Math.floor(available / 44));
}

function renderDiagnostics() {
    const container = document.getElementById('diagnostics-list');
    if (!container) return;

    const allLogs = [
        ...serviceLogs.map(r => ({...r, _type:'service'})),
        ...refuelLogs.map(r  => ({...r, _type:'refuel'}))
    ].sort((a,b) => new Date(b.date)-new Date(a.date));

    if (!allLogs.length) {
        container.innerHTML = '<div class="text-center text-slate-400 font-mono text-sm py-3">데이터 없음</div>';
        return;
    }

    const maxItems = calcMaxDiagItems();
    const items = allLogs.slice(0, maxItems);

    if (!items.length) { container.innerHTML = ''; return; }

    container.innerHTML = items.map(r => {
        const icon = r._type === 'refuel' ? '\u26fd' : '\ud83d\udd27';
        const name = r._type === 'refuel' ? (r.station||'\uc8fc\uc720\uc18c') : (r.name||'-');
        const cost = (parseFloat(r.cost)||0).toLocaleString();
        return `<div class="flex justify-between items-center py-1.5 border-b border-slate-100 last:border-0">
            <div class="flex items-center gap-2 min-w-0">
                <span class="text-sm shrink-0 leading-none">${icon}</span>
                <div class="min-w-0">
                    <div class="font-mono text-xs font-bold text-slate-700 truncate">${name}</div>
                    <div class="font-mono text-[10px] text-slate-400">${r.date||'--'}</div>
                </div>
            </div>
            <div class="font-mono text-xs font-bold ${r._type==='refuel'?'text-sky-600':'text-slate-500'} ml-2 shrink-0">\u20a9${cost}</div>
        </div>`;
    }).join('');
}

/* ==================== CLOCK ==================== */
function updateClock() {
    const now=new Date();
    document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-GB',{hour12:false});
    document.getElementById('live-date').textContent  = now.toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.\s/g,'.').replace(/\.$/,'');
}

/* ==================== CSV PARSER ==================== */
function parseCSV(t) {
    const rows=[]; let row=[],cur='',q=false;
    for(let i=0;i<t.length;i++){
        const c=t[i],nc=t[i+1];
        if(c==='"'){if(q&&nc==='"'){cur+='"';i++;}else{q=!q;}}
        else if(c===','&&!q){row.push(cur.replace(/\r/g,'').trim());cur='';}
        else if(c==='\n'&&!q){row.push(cur.replace(/\r/g,'').trim());rows.push(row);row=[];cur='';}
        else{cur+=c;}
    }
    row.push(cur.replace(/\r/g,'').trim());rows.push(row);
    if(rows.length<2)return[];
    const hdrs=rows[0];
    return rows.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>{const o={};hdrs.forEach((h,i)=>o[h]=r[i]!==undefined?r[i]:'');return o;});
}

/* ==================== SYNC ==================== */
let currentSyncCallback=null, currentSyncBtn=null, originalSyncBtnHTML='';

function syncDataToCloud(sheetName, data, btnEl, originalHTML, callback) {
    if (window.isSaving) return;
    window.isSaving=true; window.syncMode='button';
    currentSyncBtn=btnEl; currentSyncCallback=callback; originalSyncBtnHTML=originalHTML;
    if (!A_URL) { setTimeout(onSaveSuccess, 800); return; }
    document.getElementById('payload_input').value = JSON.stringify({action:'write',sheetName,data});
    document.getElementById('hidden_form').action  = A_URL;
    document.getElementById('hidden_form').submit();
}

function syncManage(sheetName, data) {
    if (window.isSaving) return;
    window.isSaving=true; window.syncMode='manage';
    setManageStatus('SYNCING...');
    if (!A_URL) {
        setTimeout(() => {
            window.isSaving=false;
            setManageStatus('\u2713 SAVED'); setTimeout(()=>setManageStatus(''),2000);
            updateDashboard(); renderDiagnostics(); renderManageContent();
        }, 400);
        return;
    }
    document.getElementById('payload_input').value = JSON.stringify({action:'write',sheetName,data});
    document.getElementById('hidden_form').action  = A_URL;
    document.getElementById('hidden_form').submit();
}

function onSaveSuccess() {
    window.isSaving=false;
    const mode=window.syncMode||'button'; window.syncMode=null;
    if (mode==='manage') {
        setManageStatus('\u2713 SAVED'); setTimeout(()=>setManageStatus(''),2000);
        updateDashboard(); renderDiagnostics(); renderManageContent();
        return;
    }
    if (!currentSyncBtn||!currentSyncCallback) return;
    currentSyncBtn.innerHTML='<i class="fa-solid fa-check"></i> SUCCESS';
    currentSyncBtn.classList.replace('bg-sky-500','bg-emerald-500');
    currentSyncBtn.classList.replace('bg-slate-800','bg-emerald-500');
    setTimeout(()=>{
        currentSyncCallback();
        updateDashboard(); renderDiagnostics();
        setTimeout(()=>{
            currentSyncBtn.innerHTML=originalSyncBtnHTML;
            currentSyncBtn.classList.remove('bg-emerald-500');
            currentSyncBtn.classList.add(currentSyncBtn.id.includes('refuel')?'bg-sky-500':'bg-slate-800');
        },300);
    },800);
}

function setManageStatus(text) {
    const el=document.getElementById('manage-sync-status');
    if(el){el.textContent=text; el.className='font-mono text-[10px] '+(text.includes('\u2713')?'text-emerald-500':'text-amber-500');}
}

/* ==================== MAIN MODALS ==================== */
const backdrop     = document.getElementById('modal-backdrop');
const refuelModal  = document.getElementById('refuel-modal');
const serviceModal = document.getElementById('service-modal');

function openModal(modal){
    backdrop.classList.remove('opacity-0','pointer-events-none');
    modal.classList.remove('translate-y-full','pointer-events-none');
}
function closeAllModals(){
    backdrop.classList.add('opacity-0','pointer-events-none');
    refuelModal.classList.add('translate-y-full','pointer-events-none');
    serviceModal.classList.add('translate-y-full','pointer-events-none');
}

document.getElementById('btn-open-refuel').addEventListener('click', () => {
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('input-refuel-date').value = today;
    document.getElementById('refuel-date-preview').textContent = today;
    document.getElementById('refuel-date-details').removeAttribute('open');
    openModal(refuelModal);
});
document.getElementById('btn-close-refuel').addEventListener('click', closeAllModals);
document.getElementById('btn-open-service').addEventListener('click', () => {
    document.getElementById('input-service-date').valueAsDate = new Date();
    openItemSelector();
});
document.getElementById('btn-close-service').addEventListener('click', closeAllModals);
backdrop.addEventListener('click', closeAllModals);

/* ==================== REFUEL LOGIC ==================== */
const inPrice = document.getElementById('input-price');
const inCost  = document.getElementById('input-cost');
const outVol  = document.getElementById('display-volume');

function calcVolume(){
    const p=parseFloat(inPrice.value), c=parseFloat(inCost.value);
    outVol.textContent = (p>0&&c>0) ? (c/p).toFixed(2) : '0.00';
}
inPrice.addEventListener('input', calcVolume);
inCost.addEventListener('input',  calcVolume);

document.getElementById('btn-submit-refuel').addEventListener('click', function(){
    if(!inPrice.value||!inCost.value) return;
    const logData = {
        id:          Date.now().toString(),
        date:        document.getElementById('input-refuel-date').value || new Date().toISOString().slice(0,10),
        station:     document.getElementById('input-station').value || '\uc8fc\uc720\uc18c',
        odo:         document.getElementById('input-refuel-odo').value,
        price:       inPrice.value, cost:inCost.value, volume:outVol.textContent,
        is_full_tank:document.getElementById('input-fulltank').checked?'TRUE':'FALSE'
    };
    refuelLogs.push(logData);
    const btn=this, orig=btn.innerHTML;
    btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> SYNCING...';
    syncDataToCloud('refuel_tx', refuelLogs, btn, orig, () => {
        closeAllModals();
        inPrice.value=''; inCost.value=''; outVol.textContent='0.00';
        document.getElementById('input-station').value='';
    });
});

/* ==================== ITEM SELECTOR ==================== */
const itemSelectorBackdrop = document.getElementById('item-selector-backdrop');
const itemSelectorModal    = document.getElementById('item-selector-modal');
const listContainer        = document.getElementById('item-list-container');
const searchInput          = document.getElementById('input-item-search');
const displayItemText      = document.getElementById('selected-item-display');
const displayItemCode      = document.getElementById('selected-item-code');
const hiddenInputCode      = document.getElementById('input-service-item-code');
const hiddenInputName      = document.getElementById('input-service-item-name');

function renderItemList(items){
    if(!items.length){
        listContainer.className='flex-1 overflow-y-auto p-4 flex items-center justify-center no-scrollbar';
        listContainer.innerHTML='<div class="text-center text-slate-400 font-mono text-sm">\ub370\uc774\ud130 \uc5c6\uc74c<br><span class="text-[10px]">MANAGE_ALL\uc5d0\uc11c \ud56d\ubaa9\uc744 \uba3c\uc800 \ub4f1\ub85d\ud558\uc138\uc694</span></div>';
        return;
    }
    listContainer.className='flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 content-start no-scrollbar';
    listContainer.innerHTML='';
    [...items].sort((a,b)=>(a.order||99)-(b.order||99)).forEach(item=>{
        const btn=document.createElement('button');
        btn.className='w-full text-left p-3 border border-slate-200 bg-white rounded-sm hover:border-sky-400 hover:bg-slate-50 transition-all group cursor-pointer flex flex-col gap-1.5';
        btn.innerHTML=`<div class="flex justify-between items-center w-full pointer-events-none">
            <span class="font-orbitron text-[9px] text-slate-400 tracking-wider group-hover:text-sky-500 transition-colors">${item.id}</span>
            <span class="font-orbitron text-[8px] text-slate-500 px-1 py-0.5 bg-slate-100 rounded-sm">${item.tag}</span>
            </div>
            <span class="font-mono text-sm font-bold text-slate-800 leading-tight block truncate w-full pointer-events-none">${item.name}</span>`;
        btn.addEventListener('click', () => {
            displayItemText.textContent = item.name;
            displayItemText.classList.replace('text-slate-400','text-slate-800');
            displayItemText.classList.add('font-bold');
            displayItemCode.textContent = `CODE: ${item.id}`;
            displayItemCode.classList.remove('hidden');
            hiddenInputCode.value = item.id;
            hiddenInputName.value = item.name;
            closeItemSelector(); openModal(serviceModal);
        });
        listContainer.appendChild(btn);
    });
}

function openItemSelector(){
    itemSelectorBackdrop.classList.remove('opacity-0','pointer-events-none');
    itemSelectorModal.classList.remove('translate-y-full');
    renderItemList(maintenanceItems);
    setTimeout(() => searchInput.focus(), 300);
}
function closeItemSelector(){
    itemSelectorBackdrop.classList.add('opacity-0','pointer-events-none');
    itemSelectorModal.classList.add('translate-y-full');
    searchInput.value='';
}
document.getElementById('btn-open-item-selector').addEventListener('click', openItemSelector);
document.getElementById('btn-close-item-selector').addEventListener('click', closeItemSelector);
itemSelectorBackdrop.addEventListener('click', closeItemSelector);
searchInput.addEventListener('input', e => {
    const t = e.target.value.toLowerCase();
    renderItemList(maintenanceItems.filter(i =>
        i.name.toLowerCase().includes(t)||i.id.toLowerCase().includes(t)||i.tag.toLowerCase().includes(t)));
});

/* ==================== SERVICE LOGIC ==================== */
document.getElementById('btn-submit-service').addEventListener('click', function(){
    if(!hiddenInputCode.value){
        displayItemText.classList.add('text-red-500');
        displayItemText.textContent='ERROR: ITEM NOT SELECTED';
        setTimeout(()=>{displayItemText.classList.remove('text-red-500');displayItemText.textContent='\uc120\ud0dd \ub300\uae30 \uc911...';},1500);
        return;
    }
    const logData = {
        id:      Date.now().toString(),
        date:    document.getElementById('input-service-date').value,
        odo:     document.getElementById('input-service-odo').value,
        mi_code: hiddenInputCode.value,
        name:    hiddenInputName.value,
        cost:    document.getElementById('input-service-cost').value,
        memo:    document.getElementById('input-service-memo').value
    };
    serviceLogs.push(logData);
    const btn=this, orig=btn.innerHTML;
    btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> SYNCING...';
    syncDataToCloud('maintenance_history', serviceLogs, btn, orig, () => {
        closeAllModals();
        hiddenInputCode.value=''; hiddenInputName.value='';
        displayItemText.textContent='\uc120\ud0dd \ub300\uae30 \uc911...';
        displayItemText.classList.replace('text-slate-800','text-slate-400');
        displayItemText.classList.remove('font-bold');
        displayItemCode.classList.add('hidden');
        document.getElementById('input-service-cost').value='';
        document.getElementById('input-service-memo').value='';
    });
});

/* ==================== COST DETAIL ==================== */
let currentCostType = null;
const costDetailBackdrop = document.getElementById('cost-detail-backdrop');
const costDetailModal    = document.getElementById('cost-detail-modal');

function openCostDetail(type){
    currentCostType = type;
    document.getElementById('cost-detail-title').textContent = type==='refuel' ? '\u26fd REFUEL HISTORY' : '\ud83d\udd27 SERVICE HISTORY';
    costDetailBackdrop.classList.remove('opacity-0','pointer-events-none');
    costDetailModal.classList.remove('translate-y-full','pointer-events-none');
    setCostPreset('month');
}
function closeCostDetail(){
    costDetailBackdrop.classList.add('opacity-0','pointer-events-none');
    costDetailModal.classList.add('translate-y-full','pointer-events-none');
}

function setCostPreset(type) {
    const now=new Date(), y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0');
    const from=document.getElementById('cost-filter-from');
    const to  =document.getElementById('cost-filter-to');
    if (type==='month') {
        const lastDay=new Date(y,now.getMonth()+1,0).getDate();
        from.value=`${y}-${m}-01`;
        to.value  =`${y}-${m}-${String(lastDay).padStart(2,'0')}`;
    } else if (type==='year') {
        from.value=`${y}-01-01`;
        to.value  =`${y}-12-31`;
    } else {
        from.value='2000-01-01';
        to.value  =`${y+1}-12-31`;
    }
    ['month','year','all'].forEach(t => {
        const btn=document.getElementById(`preset-${t}`);
        if (!btn) return;
        btn.className = t===type
            ? 'font-orbitron text-[9px] tracking-widest px-2.5 py-1.5 rounded-sm bg-sky-500 text-white transition-colors'
            : 'font-orbitron text-[9px] tracking-widest px-2.5 py-1.5 rounded-sm border border-slate-200 text-slate-500 hover:border-sky-400 hover:text-sky-600 transition-colors';
    });
    renderCostDetail();
}

function renderCostDetail(){
    const from=new Date(document.getElementById('cost-filter-from').value);
    const to  =new Date(document.getElementById('cost-filter-to').value);
    to.setHours(23,59,59,999);
    const logs = currentCostType==='refuel' ? refuelLogs : serviceLogs;
    const filtered = logs.filter(r=>{const d=new Date(r.date);return d>=from&&d<=to;}).sort((a,b)=>new Date(b.date)-new Date(a.date));
    const total = filtered.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
    document.getElementById('cost-detail-total').textContent = '\u20a9 '+total.toLocaleString();
    const list = document.getElementById('cost-detail-list');
    if(!filtered.length){list.innerHTML='<div class="text-center text-slate-400 font-mono text-sm py-8">\ub370\uc774\ud130 \uc5c6\uc74c</div>';return;}
    list.innerHTML = filtered.map(r => {
        if(currentCostType==='refuel'){
            return`<div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-sm">
                <div class="min-w-0"><div class="font-mono text-xs font-bold text-slate-700">${r.station||'\uc8fc\uc720\uc18c'}</div>
                <div class="font-mono text-[10px] text-slate-400 truncate">${r.date} \u00b7 ${parseFloat(r.volume||0).toFixed(2)}L \u00b7 ${parseFloat(r.price||0).toLocaleString()}\uc6d0/L \u00b7 ${parseFloat(r.odo||0).toLocaleString()}km</div></div>
                <div class="font-mono text-sm font-bold text-sky-600 ml-3 shrink-0">\u20a9${parseFloat(r.cost||0).toLocaleString()}</div></div>`;
        } else {
            return`<div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-sm">
                <div class="min-w-0"><div class="font-mono text-xs font-bold text-slate-700">${r.name||'-'}</div>
                <div class="font-mono text-[10px] text-slate-400 truncate">${r.date} \u00b7 ${parseFloat(r.odo||0).toLocaleString()}km${r.memo?' \u00b7 '+r.memo:''}</div></div>
                <div class="font-mono text-sm font-bold text-slate-600 ml-3 shrink-0">\u20a9${parseFloat(r.cost||0).toLocaleString()}</div></div>`;
        }
    }).join('');
}

document.getElementById('btn-cost-refuel').addEventListener('click', ()=>openCostDetail('refuel'));
document.getElementById('btn-cost-service').addEventListener('click', ()=>openCostDetail('service'));
document.getElementById('btn-close-cost-detail').addEventListener('click', closeCostDetail);
costDetailBackdrop.addEventListener('click', closeCostDetail);
document.getElementById('cost-filter-from').addEventListener('change', renderCostDetail);
document.getElementById('cost-filter-to').addEventListener('change',   renderCostDetail);

/* ==================== MANAGE_ALL ==================== */
let currentManageFilter = 'all';
const manageBackdrop = document.getElementById('manage-backdrop');
const manageModal    = document.getElementById('manage-modal');

function openManageAll(){
    manageBackdrop.classList.remove('opacity-0','pointer-events-none');
    manageModal.classList.remove('translate-y-full','pointer-events-none');
    renderManageContent();
}
function closeManageAll(){
    manageBackdrop.classList.add('opacity-0','pointer-events-none');
    manageModal.classList.add('translate-y-full','pointer-events-none');
}
function switchManageFilter(filter){
    currentManageFilter = filter;
    ['all','service','refuel'].forEach(f => {
        const btn = document.getElementById(`mf-${f}`);
        if (!btn) return;
        btn.className = f===filter
            ? 'font-orbitron text-[10px] tracking-widest px-3 py-1.5 rounded-sm bg-sky-500 text-white transition-colors'
            : 'font-orbitron text-[10px] tracking-widest px-3 py-1.5 rounded-sm border border-slate-200 text-slate-500 hover:border-sky-400 hover:text-sky-600 transition-colors bg-white';
    });
    renderManageContent();
}
function renderManageContent(){
    const c = document.getElementById('manage-content'); if(!c) return;
    if      (currentManageFilter==='service') renderManageServiceFull(c);
    else if (currentManageFilter==='refuel')  renderManageRefuelFull(c);
    else                                       renderManageAll(c);
}

                    <span class="font-mono text-sm font-bold text-slate-800 truncate">${r.name||'-'}</span>
                </div>
                <div class="font-mono text-[10px] text-slate-400 mt-0.5">${r.date} \u00b7 ${parseFloat(r.odo||0).toLocaleString()}km \u00b7 \u20a9${parseFloat(r.cost||0).toLocaleString()}${r.memo?' \u00b7 '+r.memo:''}</div>

            </div>
        </div>
        <div id="edit-svc-${r.id}" class="hidden px-3 pb-3 border-t border-slate-100 space-y-2">

                <div><label class="font-orbitron text-[9px] text-slate-400 block mb-0.5">DATE</label>
                    <input type="date" id="es-date-${r.id}" value="${r.date}" class="w-full bg-slate-50 border border-slate-200 rounded-sm p-2 font-mono text-xs focus:border-sky-500 outline-none"></div>
                <div><label class="font-orbitron text-[9px] text-slate-400 block mb-0.5">ODO (KM)</label>

            <div><label class="font-orbitron text-[9px] text-slate-400 block mb-0.5">MEMO</label>

            <div class="flex gap-2">
                <button onclick="saveSvcEdit('${r.id}')" class="flex-1 bg-sky-500 text-white font-orbitron text-[9px] tracking-widest py-2 rounded-sm hover:bg-sky-600 transition-colors">SAVE</button>
                <button onclick="toggleSvcEdit('${r.id}')" class="flex-1 bg-slate-100 text-slate-600 font-orbitron text-[9px] tracking-widest py-2 rounded-sm hover:bg-slate-200 transition-colors">CANCEL</button>
            </div>
        </div>
    </div>`;
}

function renderManageAll(c){
    const all = [
        ...serviceLogs.map(r=>({...r,_type:'service'})),
        ...refuelLogs.map(r =>({...r,_type:'refuel'}))
    ].sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(!all.length){c.innerHTML='<div class="text-center text-slate-400 font-mono text-sm py-8">\ub370\uc774\ud130 \uc5c6\uc74c</div>';return;}
    c.innerHTML = all.map(r=>r._type==='service'?buildSvcRow(r):buildRefuelRow(r)).join('');
}
function renderManageServiceFull(c){
    if(!serviceLogs.length){c.innerHTML='<div class="text-center text-slate-400 font-mono text-sm py-8">\ub370\uc774\ud130 \uc5c6\uc74c</div>';return;}
    c.innerHTML=[...serviceLogs].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r=>buildSvcRow(r)).join('');
}
function renderManageRefuelFull(c){
    if(!refuelLogs.length){c.innerHTML='<div class="text-center text-slate-400 font-mono text-sm py-8">\ub370\uc774\ud130 \uc5c6\uc74c</div>';return;}
    c.innerHTML=[...refuelLogs].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r=>buildRefuelRow(r)).join('');
}

/* --- Edit/Delete handlers --- */
function toggleSvcEdit(id){
    document.getElementById(`view-svc-${id}`)?.classList.toggle('hidden');
    document.getElementById(`edit-svc-${id}`)?.classList.toggle('hidden');
}
function saveSvcEdit(id){
    const idx=serviceLogs.findIndex(s=>s.id===id); if(idx===-1)return;
    serviceLogs[idx]={...serviceLogs[idx],
        date:document.getElementById(`es-date-${id}`)?.value ||serviceLogs[idx].date,
        odo: document.getElementById(`es-odo-${id}`)?.value  ||serviceLogs[idx].odo,
        cost:document.getElementById(`es-cost-${id}`)?.value ||serviceLogs[idx].cost,
        memo:document.getElementById(`es-memo-${id}`)?.value ||''
    };
    syncManage('maintenance_history',serviceLogs);
}
function deleteSvc(id){
    if(!confirm('\uc774 \uc815\ube44\uae30\ub85d\uc744 \uc0ad\uc81c\ud560\uae4c\uc694?'))return;
    serviceLogs=serviceLogs.filter(s=>s.id!==id);
    syncManage('maintenance_history',serviceLogs);
}
function toggleRefuelEdit(id){
    document.getElementById(`view-rfuel-${id}`)?.classList.toggle('hidden');
    document.getElementById(`edit-rfuel-${id}`)?.classList.toggle('hidden');
}
function saveRefuelEdit(id){
    const idx=refuelLogs.findIndex(r=>r.id===id); if(idx===-1)return;
    refuelLogs[idx]={...refuelLogs[idx],
        date:   document.getElementById(`er-date-${id}`)?.value   ||refuelLogs[idx].date,
        odo:    document.getElementById(`er-odo-${id}`)?.value    ||refuelLogs[idx].odo,
        station:document.getElementById(`er-station-${id}`)?.value||refuelLogs[idx].station,
        price:  document.getElementById(`er-price-${id}`)?.value  ||refuelLogs[idx].price,
        volume: document.getElementById(`er-volume-${id}`)?.value ||refuelLogs[idx].volume,
        cost:   document.getElementById(`er-cost-${id}`)?.value   ||refuelLogs[idx].cost
    };
    syncManage('refuel_tx',refuelLogs);
}
function deleteRefuel(id){
    if(!confirm('\uc774 \uc8fc\uc720\uae30\ub85d\uc744 \uc0ad\uc81c\ud560\uae4c\uc694?'))return;
    refuelLogs=refuelLogs.filter(r=>r.id!==id);
    syncManage('refuel_tx',refuelLogs);
}

/* MANAGE_ALL event listeners */
document.getElementById('btn-close-manage').addEventListener('click', closeManageAll);
manageBackdrop.addEventListener('click', closeManageAll);
document.getElementById('btn-open-manage-diag').addEventListener('click', openManageAll);
</script>
